<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- 外部への通信をすべて禁止（データ流出防止）。外部ファイル・フォント・解析ツールは一切読み込まない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1B19" media="(prefers-color-scheme: dark)">
<title>家計ノート</title>
<style>
:root{
  --bg:#F4F0E8; --card:#FBF8F2; --ink:#3B3631; --sub:#8A837A; --line:#E4DDD1;
  --wood:#A0805C; --wood-soft:#EBE2D4; --accent:#6E7F6A; --warn:#B0644A; --barbg:#ECE6DB;
  --shadow:0 1px 2px rgba(60,50,40,.06),0 4px 14px rgba(60,50,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1B19; --card:#272421; --ink:#EAE4DA; --sub:#A39B90; --line:#3A3631;
    --wood:#C2A07A; --wood-soft:#3A322A; --accent:#93A58E; --warn:#D08467; --barbg:#34302B;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1B19; --card:#272421; --ink:#EAE4DA; --sub:#A39B90; --line:#3A3631;
  --wood:#C2A07A; --wood-soft:#3A322A; --accent:#93A58E; --warn:#D08467; --barbg:#34302B;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ダブルタップ・入力欄タップでの拡大を防ぐ（2本指での拡大は可能なまま）。記録画面のすき間をタップしたときも対象 */
*,*::before,*::after{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding-block:calc(14px + env(safe-area-inset-top, 0px)) 16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header.top h1{font-size:17px;font-weight:600;letter-spacing:.08em;margin:0}
.period{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 14px}
.period button{width:36px;height:36px;border-radius:50%;color:var(--sub);font-size:20px}
.period button:active{background:var(--wood-soft)}
.period .lbl{text-align:center;min-width:170px}
.period .lbl b{display:block;font-size:16px;font-weight:600;letter-spacing:.03em}
.period .lbl small{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.sum .k{font-size:12px;color:var(--sub)}
.sum .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.sum .big{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.sum .big .v{font-size:24px}
.tap{border-bottom:1px dashed var(--wood)}
.muted{color:var(--sub)}
.neg{color:var(--warn)}
h2{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.12em;margin:18px 4px 8px}
.row{padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .line1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .name{font-weight:500}
.row .rem{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row .line2{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--barbg);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--wood);border-radius:99px}
.bar i.over{background:var(--warn)}
.ent{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ent:last-child{border-bottom:0}
.ent .dot{width:8px;height:8px;border-radius:50%;background:var(--wood);flex:none}
.ent .mid{flex:1;min-width:0}
.ent .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .mid small{color:var(--sub);font-size:12px}
.ent .amt{font-variant-numeric:tabular-nums;font-weight:600}
.tag{font-size:10px;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.dayhd{font-size:12px;color:var(--sub);margin:14px 4px 2px}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{flex:1;padding:6px 0;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--wood);color:#fff;margin-top:-26px;
  box-shadow:0 4px 12px rgba(80,60,40,.25);justify-content:center}
nav.tabs .fab svg{stroke-width:2.2;width:26px;height:26px}
/* シート */
.ov{position:fixed;inset:0;background:rgba(30,25,20,.35);z-index:10;display:none}
.ov.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  z-index:11;padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));max-height:94vh;overflow-y:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sheet.show{transform:none;visibility:visible;transition:transform .22s ease}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.shd b{font-size:15px}
.shd button{color:var(--sub);padding:6px}
.amtdisp{text-align:right;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.amtdisp small{font-size:16px;color:var(--sub);margin-left:4px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip.on{background:var(--wood);border-color:var(--wood);color:#fff}
.lbl2{font-size:12px;color:var(--sub);margin:6px 2px 2px}
.fields{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:6px 0 10px}
.fields input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{height:50px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:21px;font-variant-numeric:tabular-nums}
.keys button:active{background:var(--wood-soft)}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:50px;border-radius:12px;font-size:16px;font-weight:600;background:var(--wood);color:#fff}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn);font-weight:500;flex:none;padding:0 16px}
/* 設定 */
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set input{width:110px;text-align:right;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums}
.set input.sm{width:62px}
.set .r{display:flex;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px}
.seg button.on{background:var(--wood);color:#fff}
.link{color:var(--wood);font-weight:600;padding:6px 0}
.note{font-size:12px;color:var(--sub);margin:6px 2px 0}
.dlg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(30,25,20,.4);
  padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
.dlg[hidden]{display:none!important}
.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px;width:100%;max-width:340px}
.dlg .box p{margin:0 0 12px;white-space:pre-wrap}
.dlg .box input,.dlg .box textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;margin-bottom:12px}
.dlg .box textarea{height:160px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.dlg .acts{margin-top:0}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.92}
.badge{display:inline-block;font-size:11px;border-radius:99px;padding:1px 8px;background:var(--wood-soft);color:var(--wood);font-weight:600;vertical-align:2px;margin-left:6px}
.badge.done{background:var(--barbg);color:var(--sub)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>履歴</button>
  <button class="fab" id="fab" aria-label="支出を記録"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="card"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg>カード</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>設定</button>
</nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="dlg" id="dlg" hidden><div class="box" role="dialog" aria-modal="true"><p id="dlgMsg"></p><input id="dlgInput" type="text" maxlength="20" hidden><textarea id="dlgText" readonly hidden></textarea><div class="acts"><button class="btn ghost" id="dlgCancel">キャンセル</button><button class="btn" id="dlgOk">OK</button></div></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ========== データ ========== */
const KEY = 'kakeiNote.data';
const VERSION = 2;   // v2：口座残高（bank）と緊急用の額（settings.reserve）を追加

function defaultData(){
  return {
    version: VERSION,
    categories: [
      {id:'fashion', name:'服・スキンケア', group:'var',  budget:30000},
      {id:'eatout',  name:'外食など',       group:'var',  budget:12000},
      {id:'hair',    name:'美容院',         group:'var',  budget:10000},
      {id:'room',    name:'部屋づくり',     group:'var',  budget:20000},
      {id:'other',   name:'その他',         group:'var',  budget:0},
      {id:'nisa',    name:'NISA',           group:'fixed',budget:5000},
      {id:'gym',     name:'ジム',           group:'fixed',budget:4000},
      {id:'subs',    name:'サブスク',       group:'fixed',budget:5000},
      {id:'saving',  name:'貯金',           group:'save', budget:14000}
    ],
    payments: [
      {id:'rakuten', name:'楽天カード'},
      {id:'paypay',  name:'PayPay'},
      {id:'cash',    name:'現金'}
    ],
    fixed: [
      {id:'f_nisa', catId:'nisa', amount:5000, day:27, paymentId:'rakuten', active:true},
      {id:'f_gym',  catId:'gym',  amount:4000, day:27, paymentId:'rakuten', active:true},
      {id:'f_subs', catId:'subs', amount:5000, day:27, paymentId:'rakuten', active:true}
    ],
    fixedSince: todayStr(),   // この日以降の固定費を自動記録
    fixedDone: {},            // 'f_nisa:2026-11' : true（削除しても再作成しない）
    entries: [],              // {id,date,amount,catId,paymentId,memo,fixedId?,createdAt}
    incomes: {},              // '2026-10-15' : 100000（期間の開始日がキー）
    bank: {balance:null, asOf:null},   // 引き落とし口座の残高と、確認した日
    settings: {theme:'auto', reserve:30000}   // reserve：緊急用として手をつけない額
  };
}

// 旧バージョンのデータを最新の形に引き継ぐ（今後の機能追加で使う）
function migrate(d){
  const base = defaultData();
  if(!d || typeof d !== 'object') return base;
  for(const k of Object.keys(base)) if(d[k] === undefined) d[k] = base[k];
  d.settings = Object.assign({}, base.settings, d.settings||{});
  // v1 → v2：bank と settings.reserve は上の補完で追加される（既存の記録はそのまま）
  if(!d.bank || typeof d.bank!=='object') d.bank = {balance:null, asOf:null};
  d.version = VERSION;
  return d;
}

let data;
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  try{ data = migrate(raw ? JSON.parse(raw) : null); }
  catch(e){
    // 読めないデータは消さずに別名で退避
    try{ localStorage.setItem(KEY + '.broken.' + Date.now(), raw); }catch(_){}
    data = defaultData();
    setTimeout(()=>toast('保存データを読めなかったため退避しました'), 300);
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch(e){ toast('保存に失敗しました。書き出しでバックアップしてください'); return false; }
}

/* ========== 日付・期間 ========== */
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return y + '-' + pad(m) + '-' + pad(d); }
function todayStr(){ const t=new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function parts(s){ const [y,m,d]=s.split('-').map(Number); return {y,m,d}; }
function lastDay(y,m){ return new Date(y, m, 0).getDate(); }
function addMonth(y,m,k){ const t=(y*12 + (m-1)) + k; return {y:Math.floor(t/12), m:(t%12)+1}; }
// 予算期間：15日〜翌月14日。キーは開始日
function periodOf(s){
  const {y,m,d} = parts(s);
  if(d >= 15) return ymd(y,m,15);
  const p = addMonth(y,m,-1); return ymd(p.y,p.m,15);
}
function periodEnd(p){ const {y,m}=parts(p); const n=addMonth(y,m,1); return ymd(n.y,n.m,14); }
function shiftPeriod(p,k){ const {y,m}=parts(p); const n=addMonth(y,m,k); return ymd(n.y,n.m,15); }
function md(s){ const {m,d}=parts(s); return m + '/' + d; }
function periodLabel(p){ return md(p) + '〜' + md(periodEnd(p)); }
const WD = ['日','月','火','水','木','金','土'];
function dayLabel(s){ const {y,m,d}=parts(s); return m + '月' + d + '日（' + WD[new Date(y,m-1,d).getDay()] + '）'; }

/* ========== 固定費の自動記録 ========== */
function runFixed(){
  const today = todayStr(), since = data.fixedSince;
  const s = parts(since), t = parts(today);
  let changed = false;
  for(let cur = {y:s.y, m:s.m}; cur.y*12+cur.m <= t.y*12+t.m; cur = addMonth(cur.y,cur.m,1)){
    const ym = cur.y + '-' + pad(cur.m);
    for(const f of data.fixed){
      if(!f.active) continue;
      const key = f.id + ':' + ym;
      if(data.fixedDone[key]) continue;
      const date = ymd(cur.y, cur.m, Math.min(f.day, lastDay(cur.y,cur.m)));
      if(date < since || date > today) continue;
      data.entries.push({id:uid(), date, amount:f.amount, catId:f.catId, paymentId:f.paymentId, memo:'', fixedId:f.id, createdAt:Date.now()});
      data.fixedDone[key] = true; changed = true;
    }
  }
  if(changed) save();
}

/* ========== 補助 ========== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function yen(n){ return (n<0?'−':'') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cat(id){ return data.categories.find(c=>c.id===id) || {name:'（削除済み）', budget:0}; }
function pay(id){ return data.payments.find(p=>p.id===id) || {name:'（削除済み）'}; }
function entriesIn(p){ const e=periodEnd(p); return data.entries.filter(x=>x.date>=p && x.date<=e); }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
const hostTheme = document.documentElement.dataset.theme;  // 表示側（claude.ai）のテーマ
function applyTheme(){ const th=data.settings.theme, el=document.documentElement;
  if(th==='auto'){ if(hostTheme) el.dataset.theme=hostTheme; else delete el.dataset.theme; } else el.dataset.theme=th; }
// アプリ内の確認ダイアログ（ブラウザ標準の confirm/prompt は表示環境によって使えないため）
function ask({msg, input=null, text=null, ok='OK', cancel='キャンセル', danger=false}){
  return new Promise(res=>{
    const dl=document.getElementById('dlg'), inp=document.getElementById('dlgInput'), ta=document.getElementById('dlgText');
    const okB=document.getElementById('dlgOk'), cB=document.getElementById('dlgCancel');
    document.getElementById('dlgMsg').textContent=msg;
    inp.hidden = input===null; inp.value = input ?? '';
    ta.hidden = text===null; ta.value = text ?? '';
    okB.textContent=ok; okB.style.background = danger ? 'var(--warn)' : '';
    cB.hidden = cancel===null; if(cancel) cB.textContent=cancel;
    dl.hidden=false;
    if(input!==null) setTimeout(()=>inp.focus(),50);
    const done=v=>{ dl.hidden=true; okB.onclick=cB.onclick=null; res(v); };
    okB.onclick=()=>{
      if(text!==null){ // コピーはタップの中で直接行う（iPhoneの制約）
        const p = navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject();
        p.then(()=>{ toast('コピーしました'); done(true); }).catch(()=>{ ta.focus(); ta.select(); toast('全選択しました。長押しでコピーしてください'); });
        return;
      }
      done(input!==null ? inp.value : true);
    };
    cB.onclick=()=>done(input!==null ? null : false);
  });
}

/* ========== 画面 ========== */
const state = {tab:'home', period: null, cardMonth: null};

function periodNav(){
  const cur = periodOf(todayStr());
  const {y} = parts(state.period);
  return `<div class="period">
    <button data-act="prev" aria-label="前の期間">‹</button>
    <div class="lbl"><b>${periodLabel(state.period)}</b><small>${y}年${state.period===cur?'・今の期間':''}</small></div>
    <button data-act="next" aria-label="次の期間">›</button></div>`;
}

function renderHome(){
  const ents = entriesIn(state.period);
  const used = {}; let total = 0;
  for(const e of ents){ used[e.catId]=(used[e.catId]||0)+e.amount; total+=e.amount; }
  const income = data.incomes[state.period];
  const budgetSum = data.categories.reduce((a,c)=>a+(c.budget||0),0);

  let h = periodNav();
  h += `<div class="card sum">
    <div><div class="k">収入</div><button class="v ${income==null?'muted':''}" data-act="income"><span class="tap">${income==null?'入力する':yen(income)}</span></button></div>
    <div><div class="k">支出</div><div class="v">${yen(total)}</div></div>
    <div class="big"><div class="k">収入 − 支出</div><div class="v ${income!=null && income-total<0?'neg':''}">${income==null?'—':yen(income-total)}</div>
    ${income!=null?`<div class="note">予算の合計 ${yen(budgetSum)}／未配分 <span class="${income-budgetSum<0?'neg':''}">${yen(income-budgetSum)}</span></div>`:''}</div>
  </div>`;

  const groups = [['var','変動費'],['fixed','固定費'],['save','貯金']];
  for(const [g,label] of groups){
    const cs = data.categories.filter(c=>c.group===g);
    if(!cs.length) continue;
    h += `<h2>${label}</h2><div class="card">`;
    for(const c of cs){
      const u = used[c.id]||0, b = c.budget||0;
      if(g==='save'){
        h += `<div class="row"><div class="line1"><span class="name">${esc(c.name)}</span><span class="rem">${yen(b)}</span></div>
          <div class="line2"><span>毎月の目標額</span><span>記録機能は第4段階で追加</span></div></div>`;
        continue;
      }
      if(!b){
        h += `<div class="row"><div class="line1"><span class="name">${esc(c.name)}</span><span class="rem">${yen(u)}</span></div>
          <div class="line2"><span>予算なし</span><span>使った額</span></div></div>`;
        continue;
      }
      const r = b-u, pct = Math.min(100, u/b*100);
      h += `<div class="row"><div class="line1"><span class="name">${esc(c.name)}</span><span class="rem ${r<0?'neg':''}">残り ${yen(r)}</span></div>
        <div class="bar"><i class="${r<0?'over':''}" style="width:${pct}%"></i></div>
        <div class="line2"><span>${yen(u)} 使用</span><span>予算 ${yen(b)}</span></div></div>`;
    }
    h += `</div>`;
  }

  const recent = [...ents].sort(sortEnt).slice(0,5);
  h += `<h2>最近の記録</h2><div class="card">${recent.length? recent.map(entRow).join('') : '<div class="empty">この期間の記録はまだありません</div>'}</div>`;
  return h;
}

function sortEnt(a,b){ return a.date===b.date ? b.createdAt-a.createdAt : (a.date<b.date?1:-1); }
function entRow(e, showDate=true){
  const c = cat(e.catId);
  const sub = showDate ? md(e.date) + '・' + pay(e.paymentId).name : pay(e.paymentId).name;
  return `<button class="ent" data-edit="${e.id}"><span class="dot"></span>
    <span class="mid"><div>${esc(c.name)}${e.fixedId?'<span class="tag">自動</span>':''}${e.memo?` <span class="muted">${esc(e.memo)}</span>`:''}</div><small>${esc(sub)}</small></span>
    <span class="amt">${yen(e.amount)}</span></button>`;
}

function renderList(){
  const ents = [...entriesIn(state.period)].sort(sortEnt);
  const total = ents.reduce((a,e)=>a+e.amount,0);
  let h = periodNav();
  h += `<div class="card sum"><div><div class="k">件数</div><div class="v">${ents.length}件</div></div><div><div class="k">合計</div><div class="v">${yen(total)}</div></div></div>`;
  if(!ents.length) return h + '<div class="empty">この期間の記録はまだありません</div>';
  let day = null;
  for(const e of ents){
    if(e.date!==day){ if(day) h+='</div>'; day=e.date; h+=`<div class="dayhd">${dayLabel(day)}</div><div class="card" style="padding-top:2px;padding-bottom:2px">`; }
    h += entRow(e, false);
  }
  return h + '</div>';
}

/* ========== カード（締め月：1日〜月末、翌月27日払い） ========== */
const CARD_ID = 'rakuten', BILL_DAY = 27;
function thisMonth(){ return todayStr().slice(0,7); }
function shiftMonth(ym,k){ const [y,m]=ym.split('-').map(Number); const n=addMonth(y,m,k); return n.y+'-'+pad(n.m); }
function billDate(ym){ const n=shiftMonth(ym,1); const [y,m]=n.split('-').map(Number); return ymd(y,m,BILL_DAY); }
function monthEnts(ym){ return data.entries.filter(e=>e.date.slice(0,7)===ym); }

// 次の引き落とし日（今日が27日以前なら今月27日、過ぎていれば翌月27日）
function nextBill(today){
  const {y,m,d} = parts(today);
  if(d <= BILL_DAY) return ymd(y,m,BILL_DAY);
  const n = addMonth(y,m,1); return ymd(n.y,n.m,BILL_DAY);
}
// 直近の入力済み収入（未入力の期間の見込みに使う）
function latestIncome(){ const ks = Object.keys(data.incomes).sort(); return ks.length ? data.incomes[ks[ks.length-1]] : null; }

// 残高を確認した日より後〜次の引き落とし日までの入出金を足し引きする
function forecast(){
  const today = todayStr(), B = nextBill(today), bk = data.bank;
  if(bk.balance==null || !bk.asOf) return {B, ready:false};
  const after = bk.asOf, lines = [];
  let v = bk.balance;
  // 収入（15日）
  for(let p = shiftPeriod(periodOf(after),1); p <= B; p = shiftPeriod(p,1)){
    if(p <= after) continue;
    const inc = data.incomes[p];
    const est = inc==null ? latestIncome() : inc;
    if(est==null) { lines.push({label:md(p)+' 収入', amount:0, note:'未入力'}); continue; }
    v += est; lines.push({label:md(p)+' 収入', amount:est, note: inc==null?'見込み':''});
  }
  // カードの引き落とし（27日）
  for(let ym = shiftMonth(after.slice(0,7),-1); billDate(ym) <= B; ym = shiftMonth(ym,1)){
    const bd = billDate(ym); if(bd <= after) continue;
    const amt = data.entries.filter(e=>e.paymentId===CARD_ID && e.date.slice(0,7)===ym).reduce((a,e)=>a+e.amount,0);
    v -= amt; lines.push({label:md(bd)+' 引き落とし（'+Number(ym.slice(5))+'月分）', amount:-amt, note: ym>=today.slice(0,7)?'利用中':''});
  }
  // PayPay・現金など（残高確認後に記録した分）
  const other = data.entries.filter(e=>e.paymentId!==CARD_ID && e.date>after && e.date<=B).reduce((a,e)=>a+e.amount,0);
  if(other){ v -= other; lines.push({label:'PayPay・現金など', amount:-other, note:''}); }
  return {B, ready:true, after, value:v, usable:v-(data.settings.reserve||0), lines};
}

function renderForecast(){
  const f = forecast(), bk = data.bank, rsv = data.settings.reserve||0;
  let h = `<h2>${dayLabel(f.B)}の引き落とし後</h2><div class="card">`;
  if(!f.ready){
    return h + `<div class="empty" style="padding:10px 0">引き落とし口座の残高を入力すると、見通しを表示します</div>
      <div class="acts" style="margin-top:4px"><button class="btn" data-act="bank">残高を入力</button></div></div>`;
  }
  h += `<div class="sum">
    <div class="big" style="border-top:0;padding-top:0"><div class="k">使えるお金（緊急用 ${yen(rsv)} を除く）</div><div class="v ${f.usable<0?'neg':''}">${yen(f.usable)}</div>
    ${f.value<0?'<div class="note neg">引き落としに残高が足りない見込みです</div>':f.usable<0?'<div class="note neg">緊急用の貯金に手をつける見込みです</div>':''}</div></div>
    <div class="row" style="margin-top:6px"><div class="line1"><span class="muted">口座残高（${md(bk.asOf)}時点）</span><button class="rem" data-act="bank"><span class="tap">${yen(bk.balance)}</span></button></div></div>`;
  for(const l of f.lines){
    h += `<div class="row"><div class="line1"><span>${esc(l.label)}${l.note?`<span class="tag">${l.note}</span>`:''}</span><span class="rem ${l.amount<0?'':''}">${l.amount>=0?'+':''}${yen(l.amount)}</span></div></div>`;
  }
  h += `<div class="row"><div class="line1"><span class="name">口座の残り</span><span class="rem ${f.value<0?'neg':''}">${yen(f.value)}</span></div></div></div>
    <div class="note">引き落とし額は記録済みの利用から計算しています。「利用中」の月は、月末までの利用でさらに増えます。27日が休日の場合、実際の引き落としは翌営業日になることがあります。</div>`;
  return h;
}

function renderCard(){
  const ym = state.cardMonth, [y,m] = ym.split('-').map(Number);
  const today = todayStr(), bd = billDate(ym), end = ymd(y,m,lastDay(y,m));
  const all = monthEnts(ym);
  const card = all.filter(e=>e.paymentId===CARD_ID).sort(sortEnt);
  const total = card.reduce((a,e)=>a+e.amount,0);
  const status = today<ymd(y,m,1) ? ['これから（予定）','done'] : today<=end ? ['利用中（月末締め）',''] : today<bd ? ['引き落とし待ち',''] : ['引き落とし済み','done'];

  let h = `<div class="period">
    <button data-act="cprev" aria-label="前の月">‹</button>
    <div class="lbl"><b>${m}月の利用</b><small>${y}年・${m}/1〜${m}/${lastDay(y,m)}${ym===thisMonth()?'・今月':''}</small></div>
    <button data-act="cnext" aria-label="次の月">›</button></div>`;

  h += `<div class="card sum">
    <div class="big" style="border-top:0;padding-top:0"><div class="k">${esc(pay(CARD_ID).name)}の利用額<span class="badge ${status[1]}">${status[0]}</span></div><div class="v">${yen(total)}</div>
    <div class="note">${dayLabel(bd)}に引き落とし・${card.length}件</div></div>
  </div>`;

  // カテゴリ別
  if(card.length){
    const byCat = {};
    for(const e of card) byCat[e.catId]=(byCat[e.catId]||0)+e.amount;
    const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    h += `<h2>カテゴリ別</h2><div class="card">` + rows.map(([id,v])=>`<div class="row"><div class="line1"><span class="name">${esc(cat(id).name)}</span><span class="rem">${yen(v)}</span></div>
      <div class="bar"><i style="width:${total?v/total*100:0}%"></i></div></div>`).join('') + `</div>`;
  }

  // 他の支払い方法（今月の利用額の全体像）
  const others = {};
  for(const e of all) if(e.paymentId!==CARD_ID) others[e.paymentId]=(others[e.paymentId]||0)+e.amount;
  const oRows = Object.entries(others);
  if(oRows.length){
    h += `<h2>ほかの支払い方法（${m}月）</h2><div class="card">` + oRows.map(([id,v])=>`<div class="row"><div class="line1"><span class="name">${esc(pay(id).name)}</span><span class="rem">${yen(v)}</span></div></div>`).join('') + `</div>`;
  }

  h += `<h2>${esc(pay(CARD_ID).name)}の明細</h2>`;
  if(!card.length) return h + `<div class="card"><div class="empty">${m}月のカード利用はまだありません</div></div>`;
  let day=null;
  for(const e of card){
    if(e.date!==day){ if(day) h+='</div>'; day=e.date; h+=`<div class="dayhd">${dayLabel(day)}</div><div class="card" style="padding-top:2px;padding-bottom:2px">`; }
    h += entRow(e,false);
  }
  return h + `</div><div class="note">月末締め・翌月${BILL_DAY}日払いとして計算しています。予算（15日区切り）の集計には影響しません。</div>`;
}

    ${[['auto','自動'],['light','ライト'],['dark','ダーク']].map(([v,l])=>`<button data-theme="${v}" class="${th===v?'on':''}">${l}</button>`).join('')}
  </span></div></div>`;

  h += `<h2>バックアップ</h2><div class="card">
    <div class="set"><span>データを書き出す</span><button class="link" data-act="export">書き出し</button></div>
    <div class="set"><span>バックアップから復元</span><button class="link" data-act="import">読み込み</button></div>
  </div><div class="note">データはこの端末の中だけに保存され、外部へは送信されません。書き出したファイルには家計の記録が含まれるため、保存先にご注意ください。復元すると現在のデータは置き換わります（直前のデータは端末内に1つ退避されます）。</div>
  <div class="note" style="margin-top:14px">記録 ${data.entries.length}件・データ形式 v${data.version}</div>`;
  return h;
}

/* ========== 入力シート ========== */
let form = null;   // 記録用
let sheetMode = null;
function openSheet(html){ const s=document.getElementById('sheet'); s.innerHTML='<div class="grab"></div>'+html; document.getElementById('ov').classList.add('show'); requestAnimationFrame(()=>s.classList.add('show')); }
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); document.getElementById('ov').classList.remove('show'); form=null; sheetMode=null; }

function keypad(){ return `<div class="keys">${['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div>`; }
function amtText(v){ return v ? Number(v).toLocaleString('ja-JP') : '0'; }

function openEntry(id){
  const e = id ? data.entries.find(x=>x.id===id) : null;
  form = e ? {id:e.id, amount:String(e.amount), catId:e.catId, paymentId:e.paymentId, date:e.date, memo:e.memo||''}
           : {id:null, amount:'', catId:null, paymentId:'rakuten', date:todayStr(), memo:''};
  sheetMode = 'entry';
  drawEntry();
}
function drawEntry(){
  const cats = data.categories.filter(c=>c.group!=='save');
  openSheet(`
    <div class="shd"><b>${form.id?'記録を編集':'支出を記録'}</b><button data-act="close">閉じる</button></div>
    <div class="amtdisp" id="amt">${amtText(form.amount)}<small>円</small></div>
    <div class="lbl2">カテゴリ</div>
    <div class="chips" id="cats">${cats.map(c=>`<button class="chip ${form.catId===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>
    <div class="lbl2">支払い方法</div>
    <div class="chips" id="pays">${data.payments.map(p=>`<button class="chip ${form.paymentId===p.id?'on':''}" data-pay="${p.id}">${esc(p.name)}</button>`).join('')}</div>
    <div class="fields">
      <span class="muted">日付</span><input type="date" id="fDate" value="${form.date}">
      <span class="muted">メモ</span><input type="text" id="fMemo" maxlength="60" placeholder="任意" value="${esc(form.memo)}">
    </div>
    ${keypad()}
    <div class="acts">${form.id?'<button class="btn danger" data-act="del">削除</button>':''}<button class="btn" id="saveBtn" data-act="saveEntry">保存</button></div>
  `);
  updEntry();
}
function updEntry(){
  if(!form) return;
  const a=document.getElementById('amt'); if(a) a.innerHTML = amtText(form.amount)+'<small>円</small>';
  document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on', b.dataset.cat===form.catId));
  document.querySelectorAll('[data-pay]').forEach(b=>b.classList.toggle('on', b.dataset.pay===form.paymentId));
  const s=document.getElementById('saveBtn'); if(s) s.disabled = !(Number(form.amount)>0 && form.catId);
}
function saveEntry(){
  const amount = Number(form.amount);
  form.date = document.getElementById('fDate').value || todayStr();
  form.memo = document.getElementById('fMemo').value.trim();
  if(!(amount>0) || !form.catId) return;
  if(form.id){
    const e = data.entries.find(x=>x.id===form.id);
    Object.assign(e, {amount, catId:form.catId, paymentId:form.paymentId, date:form.date, memo:form.memo});
  }else{
    data.entries.push({id:uid(), date:form.date, amount, catId:form.catId, paymentId:form.paymentId, memo:form.memo, createdAt:Date.now()});
  }
  if(save()){
    const was = !!form.id; state.period = periodOf(form.date);
    closeSheet(); render(); toast(was?'更新しました':'記録しました');
  }
}

function openIncome(){
  const v = data.incomes[state.period];
  form = {amount: v!=null ? String(v) : ''};
  sheetMode = 'income';
  openSheet(`
    <div class="shd"><b>収入（${periodLabel(state.period)}）</b><button data-act="close">閉じる</button></div>
    <div class="amtdisp" id="amt">${amtText(form.amount)}<small>円</small></div>

}

/* ========== バックアップ ========== */
async function doExport(){
  const name = `kakei-note-backup-${todayStr().replace(/-/g,'')}.json`;
  const json = JSON.stringify(data, null, 1);
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data:json}); toast('書き出しました'); return; }
    catch(e){ if(e && (e.code==='declined' || e.code==='rate_limited')) return; }
  }else if(!(window.claude && window.claude.use)){
    // claude.ai 以外で開いたとき：共有シート（「"ファイル"に保存」）→ ダウンロードの順に試す
    try{
      const file = new File([json], name, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    try{
      const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000); return;
    }catch(e){}
  }
  // ファイル保存が使えないときは、内容をコピーしてメモなどに貼り付けて保管する
  await ask({msg:'ファイルとして保存できなかったため、バックアップの内容を表示します。コピーして安全な場所に保管してください。', text:json, ok:'コピー', cancel:'閉じる'});

}
function validBackup(d){
  return d && typeof d==='object' && Array.isArray(d.entries) && Array.isArray(d.categories) && Array.isArray(d.payments)
    && typeof d.version==='number' && d.version <= VERSION
    && d.entries.every(e=>e && typeof e.amount==='number' && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
}
function doImport(file){
  const r = new FileReader();
  r.onload = ()=>{
    let d; try{ d = JSON.parse(r.result); }catch(e){ toast('ファイルを読み込めませんでした'); return; }
    if(!validBackup(d)){ toast('このアプリのバックアップではないか、形式が新しすぎます'); return; }
    ask({msg:`記録 ${d.entries.length}件 のバックアップで、今のデータ（${data.entries.length}件）を置き換えます。`, ok:'置き換える', danger:true}).then(yes=>{ if(!yes) return;
    try{ localStorage.setItem(KEY+'.beforeImport', JSON.stringify(data)); }catch(e){}
    data = migrate(d); save(); applyTheme(); runFixed(); render(); toast('復元しました'); });
  };
  r.readAsText(file);
}

/* ========== 操作 ========== */
document.addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.tab){ state.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(b.id==='fab'){ openEntry(null); return; }
  if(d.edit){ openEntry(d.edit); return; }
  if(d.key && form){
    if(d.key==='⌫') form.amount = form.amount.slice(0,-1);
    else if(form.amount.length < 8){ form.amount = (form.amount + d.key).replace(/^0+/, ''); }
    if(sheetMode==='entry') updEntry(); else { document.getElementById('amt').innerHTML = amtText(form.amount)+'<small>円</small>'; }
    return;
  }
  if(d.cat){ form.catId=d.cat; updEntry(); return; }
  if(d.pay){ form.paymentId=d.pay; updEntry(); return; }
  if(d.theme){ data.settings.theme=d.theme; save(); applyTheme(); render(); return; }
  if(d.prename){
    const p = data.payments.find(x=>x.id===d.prename);
    ask({msg:'支払い方法の名前', input:p.name, ok:'変更'}).then(n=>{ if(n && n.trim()){ p.name=n.trim().slice(0,20); save(); render(); } });
    return;
  }
  if(d.pdel){
    if(d.used){ ask({msg:'この支払い方法で記録された支出があるため削除できません。名前の変更はできます。', cancel:null}); return; }
    ask({msg:`「${pay(d.pdel).name}」を削除しますか？`, ok:'削除', danger:true}).then(y=>{ if(y){ data.payments = data.payments.filter(x=>x.id!==d.pdel); save(); render(); } });
    return;
  }
  switch(d.act){
    case 'prev': state.period = shiftPeriod(state.period,-1); render(); break;
    case 'next': state.period = shiftPeriod(state.period, 1); render(); break;
    case 'bank': openBank(); break;
    case 'saveBank': {
      const dt = document.getElementById('bDate').value;
      if(form.amount===''){ toast('残高を入力してください'); break; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt) || dt > todayStr()){ toast('確認した日は今日以前にしてください'); break; }
      data.bank = {balance:Number(form.amount), asOf:dt}; save(); closeSheet(); render(); toast('残高を更新しました'); break;
    }
    case 'cprev': state.cardMonth = shiftMonth(state.cardMonth,-1); render(); break;
    case 'cnext': state.cardMonth = shiftMonth(state.cardMonth, 1); render(); break;
    case 'income': openIncome(); break;
    case 'close': closeSheet(); break;
    case 'saveEntry': saveEntry(); break;
    case 'del':
      { const id=form.id; ask({msg:'この記録を削除しますか？', ok:'削除', danger:true}).then(y=>{ if(y){ data.entries = data.entries.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('削除しました'); } }); }
      break;
    case 'saveIncome': {
      const n = Number(form.amount);
      if(form.amount==='') delete data.incomes[state.period]; else data.incomes[state.period]=n;
      save(); closeSheet(); render(); break;
    }
    case 'incClear': delete data.incomes[state.period]; save(); closeSheet(); render(); break;
    case 'padd': {
      ask({msg:'追加する支払い方法の名前（例：交通系IC）', input:'', ok:'追加'}).then(n=>{ if(n && n.trim()){ data.payments.push({id:uid(), name:n.trim().slice(0,20)}); save(); render(); } });
      break;
    }
    case 'export': doExport(); break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});
document.getElementById('ov').addEventListener('click', closeSheet);
document.addEventListener('change', ev=>{
  const t = ev.target, d = t.dataset;
  const num = v => Math.max(0, Math.round(Number(v)||0));
  if(d.reserve){ data.settings.reserve = num(t.value); save(); toast('更新しました'); }
  else if(d.budget){ cat(d.budget).budget = num(t.value); save(); toast('予算を更新しました'); }
  else if(d.famt){ data.fixed.find(f=>f.id===d.famt).amount = num(t.value); save(); toast('更新しました'); }
  else if(d.fday){ const v=Math.min(31,Math.max(1,num(t.value))); t.value=v; data.fixed.find(f=>f.id===d.fday).day = v; save(); toast('更新しました'); }
  else if(t.id==='importFile'){ if(t.files[0]) doImport(t.files[0]); t.value=''; }
});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ runFixed(); if(!form) render(); } });

/* ========== 起動 ========== */
load();
applyTheme();
runFixed();
state.period = periodOf(todayStr());
state.cardMonth = thisMonth();
save();
render();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
